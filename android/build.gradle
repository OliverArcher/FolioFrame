// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Capacitor's Android bridge is Java 17-compatible, although its upstream build file defaults to a Java 21 target.
// app/capacitor.build.gradle (generated by `cap sync`) also targets Java 21. Keep both on the local JDK 17 toolchain
// so FolioFrame builds without changing system Java. The afterEvaluate hook runs after capacitor.build.gradle applies.
gradle.beforeProject { project ->
    if (project.name == 'capacitor-android' || project.name == 'app') {
        project.afterEvaluate {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
